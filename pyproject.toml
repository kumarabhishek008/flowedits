[project]
name = "flowedits"
version = "0.1.0"
description = "MCP server that splits videos into frames, finds a target image in every frame, applies edits in bulk, and joins the frames back into a video."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flowedits = "flowedits.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowedits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
